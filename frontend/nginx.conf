log_format hotelmate_json escape=json '{"time":"$time_iso8601","service":"edge","requestId":"$upstream_http_x_request_id","clientRequestId":"$http_x_request_id","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time,"upstreamDuration":"$upstream_response_time","remoteAddr":"$remote_addr"}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self' http: ws:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;
  access_log /var/log/nginx/access.log hotelmate_json;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 65s;
  }

  location = /healthz {
    proxy_pass http://api:8080/healthz;
    proxy_set_header Host $host;
  }

  location = /readyz {
    proxy_pass http://api:8080/readyz;
    proxy_set_header Host $host;
  }
}
