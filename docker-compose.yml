services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, track_io_timing=on]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotelmate}
      POSTGRES_USER: ${POSTGRES_USER:-hotelmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotelmate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${HOTELMATE_API_IMAGE:-hotelmate-api:dev}
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HTTP_ADDR: :8080
      API_VERSION: ${API_VERSION:-1.0.0}
      RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
      RELEASE_IMAGE: ${HOTELMATE_API_IMAGE:-hotelmate-api:dev}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret-now}
      JWT_ISSUER: ${JWT_ISSUER:-hotelmate-api}
      STAFF_TOKEN_TTL: ${STAFF_TOKEN_TTL:-8h}
      GUEST_TOKEN_TTL: ${GUEST_TOKEN_TTL:-24h}
      ONBOARDING_TOKEN: ${ONBOARDING_TOKEN:-replace-this-onboarding-token}
      UPLOADS_DIR: /app/uploads
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-5242880}
      DOCUMENT_RETENTION: ${DOCUMENT_RETENTION:-720h}
      CHAT_RETENTION: ${CHAT_RETENTION:-2160h}
      CHAT_CONFIDENCE_THRESHOLD: ${CHAT_CONFIDENCE_THRESHOLD:-0.5}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-hotelmate}:${POSTGRES_PASSWORD:-hotelmate}@postgres:5432/${POSTGRES_DB:-hotelmate}?sslmode=disable
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    image: ${HOTELMATE_WEB_IMAGE:-hotelmate-web:dev}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  uploads:
