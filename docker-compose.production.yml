services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, track_io_timing=on]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${HOTELMATE_API_IMAGE:?HOTELMATE_API_IMAGE digest is required}
    pull_policy: ${HOTELMATE_PULL_POLICY:-always}
    user: "${HOTELMATE_API_UID:-100}:${HOTELMATE_OPERATOR_GID:?HOTELMATE_OPERATOR_GID is required}"
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      API_HTTP_ADDR: :8080
      API_VERSION: ${API_VERSION:-1.0.0}
      RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
      RELEASE_IMAGE: ${HOTELMATE_API_IMAGE:?HOTELMATE_API_IMAGE digest is required}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-hotelmate-api}
      STAFF_TOKEN_TTL: ${STAFF_TOKEN_TTL:-8h}
      GUEST_TOKEN_TTL: ${GUEST_TOKEN_TTL:-24h}
      ONBOARDING_TOKEN: ${ONBOARDING_TOKEN:?ONBOARDING_TOKEN is required}
      UPLOADS_DIR: /app/uploads
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-5242880}
      DOCUMENT_RETENTION: ${DOCUMENT_RETENTION:-720h}
      CHAT_RETENTION: ${CHAT_RETENTION:-2160h}
      CHAT_CONFIDENCE_THRESHOLD: ${CHAT_CONFIDENCE_THRESHOLD:-0.5}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      AUTO_MIGRATE: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${HOTELMATE_HOST_UPLOADS_DIR:?HOTELMATE_HOST_UPLOADS_DIR is required}:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${HOTELMATE_WEB_IMAGE:?HOTELMATE_WEB_IMAGE digest is required}
    pull_policy: ${HOTELMATE_PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-production-data:
  certbot-webroot:
