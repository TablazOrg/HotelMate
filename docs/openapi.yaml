openapi: 3.1.0
info:
  title: HotelMate API
  version: 1.0.0
  description: Production-ready tenant-aware hotel operations, revenue reporting, approved-knowledge conversations, security audit trails, and live events. Every HTTP response includes an X-Request-ID correlation header.
servers:
  - url: /api/v1
security: []
paths:
  /public/hotels/{slug}:
    get:
      summary: Read public hotel branding
      parameters:
        - $ref: '#/components/parameters/HotelSlug'
      responses:
        '200':
          description: Public hotel
          content:
            application/json:
              schema:
                type: object
                required: [hotel]
                properties:
                  hotel: { $ref: '#/components/schemas/Hotel' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/hotels/{slug}/content:
    get:
      summary: Browse active public hotel content
      parameters:
        - $ref: '#/components/parameters/HotelSlug'
      responses:
        '200':
          description: Active facilities, current promotions, restaurants, and available menu items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelContent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /onboarding/hotels:
    post:
      summary: Create a hotel and its primary administrator
      description: Requires the deployment-only X-Onboarding-Token header.
      parameters:
        - in: header
          name: X-Onboarding-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '201':
          description: Hotel created
          content:
            application/json:
              schema:
                type: object
                required: [hotel, primaryAdmin]
                properties:
                  hotel: { $ref: '#/components/schemas/Hotel' }
                  primaryAdmin: { $ref: '#/components/schemas/Staff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/staff/login:
    post:
      summary: Authenticate hotel staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotelSlug, email, password]
              properties:
                hotelSlug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Staff session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/guest/login:
    post:
      summary: Authenticate a resident guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotelSlug, roomNumber, identityNumber]
              properties:
                hotelSlug: { type: string }
                roomNumber: { type: string }
                identityNumber: { type: string, minLength: 4 }
      responses:
        '200':
          description: Guest session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/guest/reservation:
    post:
      summary: Authenticate a guest against a confirmed reservation
      description: Creates or reuses the reservation's unique pre-arrival stay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotelSlug, confirmationCode, identityNumber]
              properties:
                hotelSlug: { type: string }
                confirmationCode: { type: string, minLength: 6 }
                identityNumber: { type: string, minLength: 4 }
      responses:
        '200':
          description: Pre-arrival guest session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /staff/me:
    get:
      summary: Read the current staff principal
      security: [{ staffBearer: [] }]
      responses:
        '200':
          description: Current staff
          content:
            application/json:
              schema:
                type: object
                required: [actorType, staff, hotel]
                properties:
                  actorType: { const: staff }
                  staff: { $ref: '#/components/schemas/Staff' }
                  hotel: { $ref: '#/components/schemas/Hotel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /guest/me:
    get:
      summary: Read the current active guest stay
      security: [{ guestBearer: [] }]
      responses:
        '200':
          description: Current stay
          content:
            application/json:
              schema:
                type: object
                required: [actorType, stay]
                properties:
                  actorType: { const: guest }
                  stay: { $ref: '#/components/schemas/Stay' }
                  onlineCheckIn:
                    oneOf:
                      - $ref: '#/components/schemas/OnlineCheckIn'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /staff/users:
    get:
      summary: List staff in the authenticated hotel
      security: [{ staffBearer: [] }]
      responses:
        '200':
          description: Tenant-scoped staff
          content:
            application/json:
              schema:
                type: object
                required: [staff]
                properties:
                  staff:
                    type: array
                    items: { $ref: '#/components/schemas/Staff' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a staff account in the authenticated hotel
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password, role]
              properties:
                firstName: { type: string, minLength: 2 }
                lastName: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                role: { $ref: '#/components/schemas/StaffRole' }
      responses:
        '201':
          description: Staff created
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff: { $ref: '#/components/schemas/Staff' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/hotel:
    patch:
      summary: Update authenticated hotel branding
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, logoUrl, primaryColor, timezone]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                logoUrl: { type: string }
                primaryColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
                timezone: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Branding updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  hotel: { $ref: '#/components/schemas/Hotel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/rooms:
    get:
      summary: List rooms in the authenticated hotel
      security: [{ staffBearer: [] }]
      responses:
        '200':
          description: Tenant-scoped room list
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms: { type: array, items: { $ref: '#/components/schemas/Room' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a room
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, floor]
              properties:
                number: { type: string, maxLength: 20 }
                floor: { type: integer, minimum: -5, maximum: 200 }
                type: { type: string, maxLength: 64 }
      responses:
        '201':
          description: Room created as available
          content:
            application/json:
              schema:
                type: object
                properties:
                  room: { $ref: '#/components/schemas/Room' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/rooms/{id}/status:
    patch:
      summary: Change a non-occupied room's operational status
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/RoomStatus' }
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema:
                type: object
                properties:
                  room: { $ref: '#/components/schemas/Room' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/reservations:
    get:
      summary: List hotel reservations
      security: [{ staffBearer: [] }]
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ReservationStatus' }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Tenant-scoped reservation list
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations: { type: array, items: { $ref: '#/components/schemas/Reservation' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a pending reservation and guest
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservation' }
      responses:
        '201':
          description: Pending reservation with generated confirmation code
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/reservations/{id}/confirm:
    post:
      summary: Atomically confirm a reservation and create its pre-arrival stay
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      responses:
        '200':
          description: Confirmed reservation and unique stay
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation: { $ref: '#/components/schemas/Reservation' }
                  stay: { $ref: '#/components/schemas/Stay' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/stays/{id}/check-in:
    post:
      summary: Check in a pre-arrival stay and mark its assigned room occupied
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId]
              properties:
                roomId: { type: string, format: uuid }
      responses:
        '200':
          description: Active stay
          content:
            application/json:
              schema:
                type: object
                properties:
                  stay: { $ref: '#/components/schemas/Stay' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/stays/{id}/check-out:
    post:
      summary: Check out a stay, complete its reservation, and mark the room cleaning
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      responses:
        '200':
          description: Checked-out stay
          content:
            application/json:
              schema:
                type: object
                properties:
                  stay: { $ref: '#/components/schemas/Stay' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /guest/online-check-in:
    get:
      summary: Read the current stay's online check-in metadata
      security: [{ guestBearer: [] }]
      responses:
        '200':
          description: Current submission or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineCheckIn:
                    oneOf:
                      - $ref: '#/components/schemas/OnlineCheckIn'
                      - type: 'null'
    post:
      summary: Submit or replace a pre-arrival identity document
      description: Accepts a MIME-sniffed PDF, JPEG, or PNG. The default maximum is 5 MiB.
      security: [{ guestBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: string, format: binary }
      responses:
        '201':
          description: Private document metadata; no storage key or digest is exposed
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineCheckIn: { $ref: '#/components/schemas/OnlineCheckIn' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
  /staff/online-check-ins:
    get:
      summary: List online check-ins for the authenticated hotel
      security: [{ staffBearer: [] }]
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/OnlineCheckInStatus' }
      responses:
        '200':
          description: Tenant-scoped submissions with stay details
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineCheckIns: { type: array, items: { $ref: '#/components/schemas/OnlineCheckInWithStay' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/online-check-ins/{id}/review:
    post:
      summary: Approve or reject an online check-in
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note]
              properties:
                status: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 500, description: Required when rejecting. }
      responses:
        '200':
          description: Reviewed submission
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineCheckIn: { $ref: '#/components/schemas/OnlineCheckIn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/online-check-ins/{id}/document:
    get:
      summary: Download a retained private identity document
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      responses:
        '200':
          description: Original document bytes
          headers:
            Cache-Control: { schema: { type: string }, description: 'Always private, no-store.' }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/NotFound' }
  /guest/services:
    get:
      summary: List the authenticated hotel's active service catalog
      security: [{ guestBearer: [] }]
      responses:
        '200':
          description: Quick actions first, followed by the full active catalog
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services: { type: array, items: { $ref: '#/components/schemas/Service' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /guest/requests:
    get:
      summary: List the current stay's service requests and persisted history
      security: [{ guestBearer: [] }]
      responses:
        '200':
          description: Stay-scoped requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/ServiceRequest' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a service request for an active stay or eligible pre-arrival upsell
      security: [{ guestBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, quantity]
              properties:
                serviceId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 20 }
                notes: { type: string, maxLength: 500 }
      responses:
        '201':
          description: New request with a persisted created event
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/ServiceRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /guest/requests/{id}/cancel:
    post:
      summary: Cancel the current stay's request while it is still new
      security: [{ guestBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/ServiceRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/services:
    get:
      summary: List active and inactive hotel services
      security: [{ staffBearer: [] }]
      responses:
        '200':
          description: Tenant-scoped catalog
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services: { type: array, items: { $ref: '#/components/schemas/Service' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a hotel service
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { $ref: '#/components/schemas/Service' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/services/{id}:
    patch:
      summary: Update, reorder, price, or activate a hotel service
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '200':
          description: Updated service
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { $ref: '#/components/schemas/Service' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/content:
    get:
      summary: Read all tenant hotel content, including inactive records
      security: [{ staffBearer: [] }]
      responses:
        '200':
          description: Tenant-scoped editable content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/facilities:
    post:
      summary: Create a hotel facility
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacilityInput' }
      responses:
        '201':
          description: Facility created
          content:
            application/json:
              schema:
                type: object
                properties:
                  facility: { $ref: '#/components/schemas/Facility' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/facilities/{id}:
    patch:
      summary: Replace editable facility fields
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacilityInput' }
      responses:
        '200':
          description: Facility updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  facility: { $ref: '#/components/schemas/Facility' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/promotions:
    post:
      summary: Create a promotion
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionInput' }
      responses:
        '201':
          description: Promotion created
          content:
            application/json:
              schema:
                type: object
                properties:
                  promotion: { $ref: '#/components/schemas/Promotion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/promotions/{id}:
    patch:
      summary: Replace editable promotion fields
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionInput' }
      responses:
        '200':
          description: Promotion updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  promotion: { $ref: '#/components/schemas/Promotion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/restaurants:
    post:
      summary: Create a restaurant
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantInput' }
      responses:
        '201':
          description: Restaurant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant: { $ref: '#/components/schemas/Restaurant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/restaurants/{id}:
    patch:
      summary: Replace editable restaurant fields
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantInput' }
      responses:
        '200':
          description: Restaurant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant: { $ref: '#/components/schemas/Restaurant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/restaurants/{id}/menu-items:
    post:
      summary: Add an item to a tenant restaurant menu
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '201':
          description: Menu item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  menuItem: { $ref: '#/components/schemas/MenuItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/menu-items/{id}:
    patch:
      summary: Replace editable menu item fields
      description: Restricted to hotel administrators and operations managers.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '200':
          description: Menu item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  menuItem: { $ref: '#/components/schemas/MenuItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/requests:
    get:
      summary: Read the role-aware operational request queue
      description: Housekeeping and F&B accounts are always constrained to services assigned to their fulfillment role; category remains an optional filter inside that role-scoped queue.
      security: [{ staffBearer: [] }]
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ServiceRequestStatus' }
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/ServiceCategory' }
        - in: query
          name: assignedToMe
          schema: { type: boolean }
        - in: query
          name: unassigned
          schema: { type: boolean }
      responses:
        '200':
          description: Priority-ordered tenant and role-scoped queue
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/StaffServiceRequest' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/requests/{id}/assign:
    post:
      summary: Assign a request to an active hotel staff account
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                staffId: { type: [string, 'null'], format: uuid, description: Defaults to the current staff member. }
      responses:
        '200':
          description: Assigned request with an appended history event
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/StaffServiceRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/requests/{id}/priority:
    post:
      summary: Change operational priority
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { type: integer, minimum: 0, maximum: 3 }
      responses:
        '200':
          description: Prioritized request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/StaffServiceRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/requests/{id}/transition:
    post:
      summary: Move a request to in-progress, completed, or cancelled
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [in_progress, completed, cancelled] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated request with an appended status event
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/StaffServiceRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/requests/{id}/notes:
    post:
      summary: Append an operational note to request history
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Request with appended note
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/StaffServiceRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /guest/conversation:
    get:
      summary: Read or start the current stay's conversation
      security: [{ guestBearer: [] }]
      responses:
        '200':
          description: Conversation with non-expired message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /guest/conversation/messages:
    post:
      summary: Send a guest message and receive an approved answer or deterministic handoff
      description: Direct identifiers are redacted before persistence. Prompt-injection markers and answers below the configured confidence threshold bypass the provider and hand off to reception.
      security: [{ guestBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMessageInput' }
      responses:
        '201':
          description: Conversation containing the guest message and any immediate assistant response
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /guest/conversation/read:
    post:
      summary: Mark assistant and reception messages read for the current stay
      security: [{ guestBearer: [] }]
      responses:
        '200':
          description: Updated read state
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
  /staff/conversations:
    get:
      summary: List the tenant reception inbox
      description: Restricted to hotel administrators, operations managers, and reception.
      security: [{ staffBearer: [] }]
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ConversationStatus' }
      responses:
        '200':
          description: Last-message-ordered tenant conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/conversations/{id}:
    get:
      summary: Read a tenant conversation
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      responses:
        '200':
          description: Conversation detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /staff/conversations/{id}/messages:
    post:
      summary: Reply to a conversation handed off to reception
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMessageInput' }
      responses:
        '201':
          description: Conversation with the persisted staff response
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/conversations/{id}/read:
    post:
      summary: Mark guest messages read by reception
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      responses:
        '200':
          description: Updated read state
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
  /staff/conversations/{id}/close:
    post:
      summary: Close a reception conversation
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      responses:
        '200':
          description: Closed conversation with a system message
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: '#/components/schemas/Conversation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff/knowledge:
    get:
      summary: List all tenant knowledge versions and moderation states
      security: [{ staffBearer: [] }]
      responses:
        '200':
          description: Pending versions first
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledge: { type: array, items: { $ref: '#/components/schemas/KnowledgeItem' } }
    post:
      summary: Submit a new answer or version for review
      security: [{ staffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeInput' }
      responses:
        '201':
          description: Pending knowledge version
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledgeItem: { $ref: '#/components/schemas/KnowledgeItem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/knowledge/{id}/review:
    post:
      summary: Approve or reject a pending knowledge version
      description: Restricted to primary and secondary hotel administrators. Rejection requires a note.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note]
              properties:
                status: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Reviewed knowledge version
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledgeItem: { $ref: '#/components/schemas/KnowledgeItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /staff/reports/operations:
    get:
      summary: Read tenant-scoped operational and revenue reporting
      description: Available to hotel administrators and operations managers. Dates are interpreted in the configured hotel timezone and the inclusive range may not exceed 31 days.
      security: [{ staffBearer: [] }]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Server-calculated request, revenue, occupancy, handoff, and security metrics
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: { $ref: '#/components/schemas/OperationalReport' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /staff/audit-logs:
    get:
      summary: Read the tenant security and mutation audit trail
      description: Restricted to primary and secondary hotel administrators. Identity numbers, credentials, and message bodies are never included.
      security: [{ staffBearer: [] }]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: action
          schema: { type: string, maxLength: 80 }
        - in: query
          name: outcome
          schema: { type: string, enum: [success, failure] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Reverse-chronological tenant audit page
          content:
            application/json:
              schema:
                type: object
                required: [audit]
                properties:
                  audit: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /events:
    get:
      summary: Upgrade to the live request and conversation event WebSocket
      description: Pass `hotelmate.events` and the existing JWT as the two Sec-WebSocket-Protocol values. Events are filtered by signed hotel, guest stay, and staff department. Persisted REST history is authoritative after reconnect.
      parameters:
        - in: header
          name: Sec-WebSocket-Protocol
          required: true
          description: The values `hotelmate.events` and the current guest or staff JWT.
          schema: { type: string, example: 'hotelmate.events, eyJ...' }
      responses:
        '101': { description: WebSocket connection established }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  parameters:
    HotelSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT with the hotelmate:staff audience.
    guestBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT with the hotelmate:guest audience and an active stay.
  schemas:
    Hotel:
      type: object
      required: [id, name, slug, logoUrl, primaryColor, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: string }
        primaryColor: { type: string }
        timezone: { type: string }
    StaffRole:
      type: string
      enum: [primary_admin, secondary_admin, operations_manager, reception, housekeeping, food_beverage]
    Staff:
      type: object
      required: [id, firstName, lastName, email, role, isActive]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/StaffRole' }
        isActive: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
    Stay:
      type: object
      required: [id, status, guest, room, hotel]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, pre_arrival, checked_out] }
        guest:
          type: object
          properties:
            id: { type: string, format: uuid }
            firstName: { type: string }
            lastName: { type: string }
        room:
          $ref: '#/components/schemas/Room'
        hotel: { $ref: '#/components/schemas/Hotel' }
        checkInAt: { type: [string, 'null'], format: date-time }
        checkOutAt: { type: [string, 'null'], format: date-time }
        reservation: { $ref: '#/components/schemas/Reservation' }
    RoomStatus:
      type: string
      enum: [available, occupied, cleaning, out_of_service]
    Room:
      type: object
      required: [id, number, floor, type, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        floor: { type: integer }
        type: { type: string }
        status: { $ref: '#/components/schemas/RoomStatus' }
    ReservationStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed]
    Reservation:
      type: object
      required: [id, status, confirmationCode, arrivalDate, departureDate, guest]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        confirmationCode: { type: string }
        arrivalDate: { type: string, format: date-time }
        departureDate: { type: string, format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
        guest:
          type: object
          required: [id, firstName, lastName]
          properties:
            id: { type: string, format: uuid }
            firstName: { type: string }
            lastName: { type: string }
        room:
          oneOf:
            - $ref: '#/components/schemas/Room'
            - type: 'null'
        stay:
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [pre_arrival, active, checked_out] }
            room: { $ref: '#/components/schemas/Room' }
            checkInAt: { type: [string, 'null'], format: date-time }
            checkOutAt: { type: [string, 'null'], format: date-time }
    CreateReservation:
      type: object
      required: [guest, roomId, arrivalDate, departureDate]
      properties:
        guest:
          type: object
          required: [firstName, lastName, identityType, identityNumber]
          properties:
            firstName: { type: string, minLength: 2 }
            lastName: { type: string, minLength: 2 }
            identityType: { type: string, enum: [national_id, passport] }
            identityNumber: { type: string, minLength: 4 }
            phone: { type: string }
        roomId: { type: string, format: uuid }
        arrivalDate: { type: string, format: date }
        departureDate: { type: string, format: date }
    OnlineCheckInStatus:
      type: string
      enum: [submitted, approved, rejected]
    OnlineCheckIn:
      type: object
      required: [id, status, documentName, documentMediaType, documentSize, submittedAt, retentionUntil, documentAvailable]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OnlineCheckInStatus' }
        documentName: { type: string }
        documentMediaType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        documentSize: { type: integer, format: int64 }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedById: { type: [string, 'null'], format: uuid }
        reviewNote: { type: string }
        retentionUntil: { type: string, format: date-time }
        documentAvailable: { type: boolean }
    OnlineCheckInWithStay:
      allOf:
        - $ref: '#/components/schemas/OnlineCheckIn'
        - type: object
          required: [stay]
          properties:
            stay: { $ref: '#/components/schemas/Stay' }
    ServiceCategory:
      type: string
      enum: [housekeeping, food_beverage, transport, wellness, other]
    Service:
      type: object
      required: [id, code, name, description, category, icon, fulfillmentRole, estimatedMinutes, priceCents, currency, isPaid, isQuickAction, isPreArrival, availableFrom, availableUntil, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/ServiceCategory' }
        icon: { type: string }
        fulfillmentRole: { type: string, enum: [reception, housekeeping, food_beverage] }
        estimatedMinutes: { type: integer, minimum: 1, maximum: 1440 }
        priceCents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        isPaid: { type: boolean }
        isQuickAction: { type: boolean }
        isPreArrival: { type: boolean, description: Allows this paid service to be ordered before hotel arrival. }
        availableFrom: { type: string, pattern: '^(|([01][0-9]|2[0-3]):[0-5][0-9])$', description: Optional local hotel-timezone start time. }
        availableUntil: { type: string, pattern: '^(|([01][0-9]|2[0-3]):[0-5][0-9])$', description: Optional local hotel-timezone end time; earlier values create an overnight window. }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    ServiceInput:
      type: object
      required: [code, name, description, category, icon, fulfillmentRole, estimatedMinutes, priceCents, currency, isPaid, isQuickAction, isPreArrival, availableFrom, availableUntil, sortOrder, isActive]
      properties:
        code: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 64 }
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        category: { $ref: '#/components/schemas/ServiceCategory' }
        icon: { type: string, minLength: 2, maxLength: 32 }
        fulfillmentRole: { type: string, enum: [reception, housekeeping, food_beverage] }
        estimatedMinutes: { type: integer, minimum: 1, maximum: 1440 }
        priceCents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        isPaid: { type: boolean }
        isQuickAction: { type: boolean }
        isPreArrival: { type: boolean }
        availableFrom: { type: string, pattern: '^(|([01][0-9]|2[0-3]):[0-5][0-9])$' }
        availableUntil: { type: string, pattern: '^(|([01][0-9]|2[0-3]):[0-5][0-9])$' }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean }
    Facility:
      type: object
      required: [id, name, description, icon, hours, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        hours: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    FacilityInput:
      type: object
      required: [name, description, icon, hours, sortOrder, isActive]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        icon: { type: string, minLength: 2, maxLength: 32 }
        hours: { type: string, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean }
    Promotion:
      type: object
      required: [id, title, description, discountPct, badgeText, startsAt, endsAt, isActive]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        discountPct: { type: number, minimum: 0, maximum: 100 }
        badgeText: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isActive: { type: boolean }
    PromotionInput:
      type: object
      required: [title, description, discountPct, badgeText, startsAt, endsAt, isActive]
      properties:
        title: { type: string, minLength: 2, maxLength: 140 }
        description: { type: string, maxLength: 700 }
        discountPct: { type: number, minimum: 0, maximum: 100 }
        badgeText: { type: string, maxLength: 32 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isActive: { type: boolean }
    MenuItem:
      type: object
      required: [id, restaurantId, name, description, priceCents, currency, sortOrder, isAvailable]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer, format: int64, minimum: 0, description: Integer IRR amount; compatibility field name retained. }
        currency: { type: string, minLength: 3, maxLength: 3 }
        sortOrder: { type: integer }
        isAvailable: { type: boolean }
    MenuItemInput:
      type: object
      required: [name, description, priceCents, currency, sortOrder, isAvailable]
      properties:
        name: { type: string, minLength: 2, maxLength: 140 }
        description: { type: string, maxLength: 500 }
        priceCents: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        isAvailable: { type: boolean }
    Restaurant:
      type: object
      required: [id, name, description, hours, sortOrder, isActive, menuItems]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        hours: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        menuItems: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
    RestaurantInput:
      type: object
      required: [name, description, hours, sortOrder, isActive]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        hours: { type: string, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean }
    HotelContent:
      type: object
      required: [hotel, facilities, promotions, restaurants]
      properties:
        hotel: { $ref: '#/components/schemas/Hotel' }
        facilities: { type: array, items: { $ref: '#/components/schemas/Facility' } }
        promotions: { type: array, items: { $ref: '#/components/schemas/Promotion' } }
        restaurants: { type: array, items: { $ref: '#/components/schemas/Restaurant' } }
    ServiceRequestStatus:
      type: string
      enum: [new, in_progress, completed, cancelled]
    ServiceRequestEvent:
      type: object
      required: [id, eventType, actorType, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string, enum: [created, assigned, priority_changed, status_changed, note_added] }
        fromStatus: { $ref: '#/components/schemas/ServiceRequestStatus' }
        toStatus: { $ref: '#/components/schemas/ServiceRequestStatus' }
        actorType: { type: string, enum: [guest, staff] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    ServiceRequest:
      type: object
      required: [id, status, priority, quantity, notes, totalPriceCents, service, events, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ServiceRequestStatus' }
        priority: { type: integer, minimum: 0, maximum: 3 }
        quantity: { type: integer }
        notes: { type: string }
        totalPriceCents: { type: integer, format: int64 }
        service: { $ref: '#/components/schemas/Service' }
        assignedTo:
          oneOf:
            - $ref: '#/components/schemas/Staff'
            - type: 'null'
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/ServiceRequestEvent' } }
    StaffServiceRequest:
      allOf:
        - $ref: '#/components/schemas/ServiceRequest'
        - type: object
          required: [stay]
          properties:
            stay:
              type: object
              required: [id, guest, room]
              properties:
                id: { type: string, format: uuid }
                guest:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    firstName: { type: string }
                    lastName: { type: string }
                room: { $ref: '#/components/schemas/Room' }
    ConversationStatus:
      type: string
      enum: [ai, handed_off, closed]
    ConversationMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
    ChatMessage:
      type: object
      required: [id, role, body, senderName, redacted, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [guest, ai, staff, system] }
        body: { type: string }
        senderName: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        redacted: { type: boolean, description: True when direct identifiers were removed before persistence. }
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, status, guest, assignedTo, guestUnreadCount, staffUnreadCount, lastMessageAt, messages]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        guest:
          type: object
          required: [id, firstName, lastName]
          properties:
            id: { type: string, format: uuid }
            firstName: { type: string }
            lastName: { type: string }
        stay:
          type: object
          required: [id, room]
          properties:
            id: { type: string, format: uuid }
            room: { $ref: '#/components/schemas/Room' }
        assignedTo:
          oneOf:
            - $ref: '#/components/schemas/Staff'
            - type: 'null'
        guestUnreadCount: { type: integer, minimum: 0 }
        staffUnreadCount: { type: integer, minimum: 0 }
        lastMessageAt: { type: string, format: date-time }
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
    KnowledgeStatus:
      type: string
      enum: [draft, pending_review, approved, rejected]
    KnowledgeItem:
      type: object
      required: [id, title, content, source, status, version, supersedesId, submittedById, reviewedById, reviewedAt, reviewNote, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        source: { type: string }
        status: { $ref: '#/components/schemas/KnowledgeStatus' }
        version: { type: integer, minimum: 1 }
        supersedesId: { type: [string, 'null'], format: uuid }
        submittedById: { type: [string, 'null'], format: uuid }
        reviewedById: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewNote: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KnowledgeInput:
      type: object
      required: [title, content, source]
      properties:
        title: { type: string, minLength: 2, maxLength: 240 }
        content: { type: string, minLength: 2, maxLength: 2000 }
        source: { type: string, maxLength: 120 }
        supersedesId: { type: [string, 'null'], format: uuid }
    ReportSummary:
      type: object
      required: [requestsCreated, openRequests, completedRequests, averageFulfillmentMinutes, paidOrders, orderedRevenueCents, recognizedRevenueCents, activeRooms, totalRooms, handedOffConversations, pendingKnowledge, failedSecurityEvents]
      properties:
        requestsCreated: { type: integer, format: int64 }
        openRequests: { type: integer, format: int64 }
        completedRequests: { type: integer, format: int64 }
        averageFulfillmentMinutes: { type: integer, format: int64 }
        paidOrders: { type: integer, format: int64 }
        orderedRevenueCents: { type: integer, format: int64, description: Integer IRR amount; compatibility field name retained. }
        recognizedRevenueCents: { type: integer, format: int64, description: Completed-order revenue in integer IRR. }
        activeRooms: { type: integer, format: int64 }
        totalRooms: { type: integer, format: int64 }
        handedOffConversations: { type: integer, format: int64 }
        pendingKnowledge: { type: integer, format: int64 }
        failedSecurityEvents: { type: integer, format: int64 }
    OperationalReport:
      type: object
      required: [from, to, timezone, currency, summary, daily, byService]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string }
        currency: { const: IRR }
        summary: { $ref: '#/components/schemas/ReportSummary' }
        daily:
          type: array
          items:
            type: object
            required: [date, requests, completed, revenueCents]
            properties:
              date: { type: string, format: date }
              requests: { type: integer, format: int64 }
              completed: { type: integer, format: int64 }
              revenueCents: { type: integer, format: int64 }
        byService:
          type: array
          items:
            type: object
            required: [serviceId, serviceName, orders, quantity, orderedRevenueCents, recognizedRevenueCents]
            properties:
              serviceId: { type: string, format: uuid }
              serviceName: { type: string }
              orders: { type: integer, format: int64 }
              quantity: { type: integer, format: int64 }
              orderedRevenueCents: { type: integer, format: int64 }
              recognizedRevenueCents: { type: integer, format: int64 }
    AuditLog:
      type: object
      required: [id, createdAt, requestId, actorType, action, outcome, ipAddress, metadata]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        requestId: { type: string }
        actorId: { type: string, format: uuid }
        actorType: { type: string }
        action: { type: string }
        outcome: { type: string, enum: [success, failure] }
        ipAddress: { type: string }
        metadata: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    RealtimeEvent:
      type: object
      required: [type, payload, emittedAt]
      properties:
        type: { type: string, enum: [connected, request.created, request.updated, message.created, conversation.handoff, conversation.updated] }
        payload: { type: object }
        emittedAt: { type: string, format: date-time }
    SessionBase:
      type: object
      required: [token, tokenType, expiresAt, actorType]
      properties:
        token: { type: string }
        tokenType: { const: Bearer }
        expiresAt: { type: string, format: date-time }
        actorType: { type: string, enum: [staff, guest] }
    StaffSession:
      allOf:
        - $ref: '#/components/schemas/SessionBase'
        - type: object
          required: [staff, hotel]
          properties:
            actorType: { const: staff }
            staff: { $ref: '#/components/schemas/Staff' }
            hotel: { $ref: '#/components/schemas/Hotel' }
    GuestSession:
      allOf:
        - $ref: '#/components/schemas/SessionBase'
        - type: object
          required: [stay]
          properties:
            actorType: { const: guest }
            stay: { $ref: '#/components/schemas/Stay' }
    OnboardingRequest:
      type: object
      required: [hotel, primaryAdmin]
      properties:
        hotel:
          type: object
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
            logoUrl: { type: string }
            primaryColor: { type: string, default: '#0f766e' }
            timezone: { type: string, default: Asia/Tehran }
        primaryAdmin:
          type: object
          required: [firstName, lastName, email, password]
          properties:
            firstName: { type: string }
            lastName: { type: string }
            email: { type: string, format: email }
            password: { type: string, format: password, minLength: 12 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role is not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Unique resource already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Input validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests for the applicable API, mutation, authentication, or onboarding window
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
