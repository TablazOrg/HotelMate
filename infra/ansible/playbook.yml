---
- name: Harden and configure HotelMate hosts
  hosts: all
  become: true
  vars:
    hotelmate_source_root: "{{ playbook_dir }}/../.."
  pre_tasks:
    - name: Refuse an unapproved alert receiver in production
      ansible.builtin.assert:
        that:
          - hotelmate_environment != 'production' or (hotelmate_alert_receiver_configured | bool and hotelmate_alertmanager_config is defined)
        fail_msg: Production requires an approved Alertmanager receiver and escalation owner.

    - name: Require a dedicated recovery-drill configuration when scheduling drills
      ansible.builtin.assert:
        that:
          - hotelmate_recovery_drill_env is defined
        fail_msg: Scheduled drills require a Vault-protected, isolated recovery-drill environment.
      when: hotelmate_recovery_drill_enabled | default(false) | bool

    - name: Calculate the release CLI checksum on the controller
      ansible.builtin.stat:
        path: "{{ hotelmate_cli_artifact }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: hotelmate_cli_artifact_stat

    - name: Verify the release CLI against its trusted checksum
      ansible.builtin.assert:
        that:
          - hotelmate_cli_artifact_stat.stat.exists
          - hotelmate_cli_artifact_stat.stat.checksum == hotelmate_cli_sha256
        fail_msg: The operations CLI does not match the approved release checksum.

    - name: Calculate the cosign checksum on the controller
      ansible.builtin.stat:
        path: "{{ hotelmate_cosign_artifact }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: hotelmate_cosign_artifact_stat

    - name: Verify cosign against its trusted checksum
      ansible.builtin.assert:
        that:
          - hotelmate_cosign_artifact_stat.stat.exists
          - hotelmate_cosign_artifact_stat.stat.checksum == hotelmate_cosign_sha256
        fail_msg: Cosign does not match the approved upstream checksum.

  tasks:
    - name: Keep the static hostname resolvable for sudo and local services
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ ansible_facts['hostname'] }}"
        state: present

    - name: Install host security and operations packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - certbot
          - docker.io
          - docker-buildx
          - docker-compose-v2
          - fail2ban
          - postgresql-client-16
          - restic
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true

    - name: Inspect the managed swap file
      ansible.builtin.stat:
        path: /swapfile
      register: hotelmate_swapfile
      when: hotelmate_swap_size_mb | default(0) | int > 0

    - name: Allocate swap for constrained single-host deployments
      ansible.builtin.command:
        cmd: "fallocate -l {{ hotelmate_swap_size_mb }}M /swapfile"
        creates: /swapfile
      when: hotelmate_swap_size_mb | default(0) | int > 0

    - name: Protect the managed swap file
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      when: hotelmate_swap_size_mb | default(0) | int > 0

    - name: Format a newly allocated swap file
      ansible.builtin.command: mkswap /swapfile
      when:
        - hotelmate_swap_size_mb | default(0) | int > 0
        - not hotelmate_swapfile.stat.exists

    - name: Persist the managed swap file
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s'
        line: /swapfile none swap sw 0 0
        state: present
      when: hotelmate_swap_size_mb | default(0) | int > 0

    - name: Inspect active swap devices
      ansible.builtin.command: swapon --show=NAME --noheadings --raw
      changed_when: false
      register: hotelmate_active_swap
      when: hotelmate_swap_size_mb | default(0) | int > 0

    - name: Activate the managed swap file
      ansible.builtin.command: swapon /swapfile
      when:
        - hotelmate_swap_size_mb | default(0) | int > 0
        - "'/swapfile' not in hotelmate_active_swap.stdout_lines"

    - name: Create the deployment operator group
      ansible.builtin.group:
        name: "{{ hotelmate_deploy_user }}"
        gid: "{{ hotelmate_deploy_gid | default(omit) }}"
        state: present

    - name: Resolve the deployment operator group
      ansible.builtin.getent:
        database: group
        key: "{{ hotelmate_deploy_user }}"

    - name: Record the deployment operator group ID
      ansible.builtin.set_fact:
        hotelmate_operator_gid: "{{ ansible_facts.getent_group[hotelmate_deploy_user][1] }}"

    - name: Create the non-root deployment user
      ansible.builtin.user:
        name: "{{ hotelmate_deploy_user }}"
        group: "{{ hotelmate_deploy_user }}"
        groups: docker,sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Install approved operator SSH keys
      ansible.posix.authorized_key:
        user: "{{ hotelmate_deploy_user }}"
        key: "{{ item }}"
        state: present
        exclusive: false
      loop: "{{ hotelmate_ssh_public_keys }}"

    - name: Preserve key-only host automation after disabling root SSH
      community.general.sudoers:
        name: hotelmate-automation
        user: "{{ hotelmate_deploy_user }}"
        commands: ALL
        nopassword: true
        state: present

    - name: Disable SSH root and password login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/90-hotelmate-hardening.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          X11Forwarding no
          AllowUsers {{ hotelmate_deploy_user }}
      notify: Restart SSH

    - name: Allow SSH, HTTP, and HTTPS only
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ hotelmate_ssh_port }}"
        - "80"
        - "443"

    - name: Enable default-deny firewall policy
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Create deployment, private, configuration, and metric directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(hotelmate_deploy_user) }}"
        group: "{{ item.group | default(hotelmate_deploy_user) }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ hotelmate_deploy_root }}", mode: "0750" }
        - { path: "{{ hotelmate_deploy_root }}/ops/observability", mode: "0750" }
        - { path: "{{ hotelmate_private_root }}", mode: "0700" }
        - { path: "{{ hotelmate_private_root }}/backups", mode: "0700" }
        - { path: "{{ hotelmate_private_root }}/evidence", mode: "0700" }
        - { path: /etc/hotelmate, mode: "0700" }
        - { path: /var/lib/node_exporter/textfile_collector, mode: "0750" }
        - { path: /srv/hotelmate-drill, mode: "0700" }
        - { path: /srv/hotelmate-drill/uploads, mode: "0700" }

    - name: Share private uploads between the unprivileged API and backup operator
      ansible.builtin.file:
        path: "{{ hotelmate_private_root }}/uploads"
        state: directory
        owner: "{{ hotelmate_api_uid }}"
        group: "{{ hotelmate_deploy_user }}"
        mode: "2770"

    - name: Find existing private upload directories
      ansible.builtin.find:
        paths: "{{ hotelmate_private_root }}/uploads"
        file_type: directory
        recurse: true
      register: hotelmate_upload_directories

    - name: Preserve operator access to existing private upload directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        group: "{{ hotelmate_deploy_user }}"
        mode: "0770"
      loop: "{{ hotelmate_upload_directories.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find existing private upload files
      ansible.builtin.find:
        paths: "{{ hotelmate_private_root }}/uploads"
        file_type: file
        recurse: true
      register: hotelmate_upload_files

    - name: Preserve operator access to existing private upload files
      ansible.builtin.file:
        path: "{{ item.path }}"
        group: "{{ hotelmate_deploy_user }}"
        mode: "0660"
      loop: "{{ hotelmate_upload_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Install protected HotelMate environment
      ansible.builtin.copy:
        dest: /etc/hotelmate/production.env
        owner: "{{ hotelmate_deploy_user }}"
        group: "{{ hotelmate_deploy_user }}"
        mode: "0600"
        content: "{{ hotelmate_production_env }}"
      when: hotelmate_manage_production_env | default(true) | bool
      no_log: true

    - name: Configure bounded Docker JSON logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: "{{ hotelmate_docker_daemon_config | to_nice_json }}\n"
      notify: Restart Docker

    - name: Install protected isolated recovery-drill environment
      ansible.builtin.copy:
        dest: /etc/hotelmate/recovery-drill.env
        owner: "{{ hotelmate_deploy_user }}"
        group: "{{ hotelmate_deploy_user }}"
        mode: "0600"
        content: "{{ hotelmate_recovery_drill_env }}"
      when: hotelmate_recovery_drill_enabled | default(false) | bool
      no_log: true

    - name: Install versioned Compose definitions
      ansible.builtin.copy:
        src: "{{ hotelmate_source_root }}/{{ item }}"
        dest: "{{ hotelmate_deploy_root }}/{{ item }}"
        owner: "{{ hotelmate_deploy_user }}"
        group: "{{ hotelmate_deploy_user }}"
        mode: "0640"
      loop:
        - docker-compose.production.yml
        - docker-compose.observability.yml

    - name: Install versioned observability configuration
      ansible.builtin.copy:
        src: "{{ hotelmate_source_root }}/ops/observability/{{ item }}"
        dest: "{{ hotelmate_deploy_root }}/ops/observability/{{ item }}"
        owner: "{{ hotelmate_deploy_user }}"
        group: "{{ hotelmate_deploy_user }}"
        directory_mode: "0750"
        mode: preserve
      loop:
        - alertmanager.yml
        - alerts.yml
        - blackbox.yml
        - config.alloy
        - grafana/
        - loki.yml

    - name: Render the approved external probe target
      ansible.builtin.copy:
        dest: "{{ hotelmate_deploy_root }}/ops/observability/prometheus.yml"
        owner: "{{ hotelmate_deploy_user }}"
        group: "{{ hotelmate_deploy_user }}"
        mode: "0640"
        content: >-
          {{ lookup('ansible.builtin.file', hotelmate_source_root + '/ops/observability/prometheus.yml', rstrip=false)
             | replace('https://hotel.example.com', hotelmate_external_probe_url | default('https://' + hotelmate_domain)) }}

    - name: Install the approved alert routing configuration
      ansible.builtin.copy:
        dest: "{{ hotelmate_deploy_root }}/ops/observability/alertmanager.yml"
        owner: "{{ hotelmate_deploy_user }}"
        group: "{{ hotelmate_deploy_user }}"
        mode: "0600"
        content: "{{ hotelmate_alertmanager_config }}"
      when: hotelmate_alertmanager_config is defined
      no_log: true

    - name: Install the release-built operations CLI
      ansible.builtin.copy:
        src: "{{ hotelmate_cli_artifact }}"
        dest: /usr/local/bin/hotelmate
        owner: root
        group: root
        mode: "0755"

    - name: Install the checksum-verified cosign binary
      ansible.builtin.copy:
        src: "{{ hotelmate_cosign_artifact }}"
        dest: /usr/local/bin/cosign
        owner: root
        group: root
        mode: "0755"

    - name: Install HotelMate systemd units
      ansible.builtin.copy:
        src: "{{ hotelmate_source_root }}/ops/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - hotelmate-backup.service
        - hotelmate-backup.timer
        - hotelmate-purge-documents.service
        - hotelmate-purge-documents.timer
        - hotelmate-purge-messages.service
        - hotelmate-purge-messages.timer
        - hotelmate-recovery-drill.service
        - hotelmate-recovery-drill.timer
      notify: Reload systemd

    - name: Install the Certbot deployment-hook directory
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Reload the edge after a successful certificate renewal
      ansible.builtin.copy:
        src: "{{ hotelmate_source_root }}/ops/certbot/hotelmate-nginx-reload"
        dest: /etc/letsencrypt/renewal-hooks/deploy/hotelmate-nginx-reload
        owner: root
        group: root
        mode: "0755"

    - name: Enable scheduled backup and privacy-retention jobs
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - hotelmate-backup.timer
        - hotelmate-purge-documents.timer
        - hotelmate-purge-messages.timer
      when: hotelmate_scheduled_operations_enabled | default(true) | bool

    - name: Enable scheduled isolated recovery drills after owner approval
      ansible.builtin.systemd_service:
        name: hotelmate-recovery-drill.timer
        enabled: true
        state: started
        daemon_reload: true
      when: hotelmate_recovery_drill_enabled | default(false) | bool

    - name: Enable unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Enable Docker, fail2ban, certificate renewal, and time synchronization
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker
        - fail2ban
        - certbot.timer
        - systemd-timesyncd

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted
