name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        options: >-
          --health-cmd "pg_isready -U hotelmate -d hotelmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        env:
          POSTGRES_DB: hotelmate_test
          POSTGRES_USER: hotelmate
          POSTGRES_PASSWORD: hotelmate
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://hotelmate:hotelmate@localhost:5432/hotelmate_test?sslmode=disable
      DATABASE_URL: postgres://hotelmate:hotelmate@localhost:5432/hotelmate_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - name: Enforce Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Rehearse migrations from a clean database
        run: go run ./cmd/hotelmate migrate up --yes
      - name: Verify migrations are idempotent
        run: go run ./cmd/hotelmate migrate up --yes
      - name: Test all Go packages
        run: go test ./...
      - name: Vet all Go packages
        run: go vet ./...
      - name: Scan Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Dependency, secret, license, and IaC policy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'
          cache: 'false'

  platform-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Ansible validation tools
        run: |
          python3 -m pip install --disable-pip-version-check ansible-core==2.21.2
          ansible-galaxy collection install -r infra/ansible/requirements.yml
      - name: Validate the host configuration playbook
        run: ansible-playbook --syntax-check -i inventory.example.yml playbook.yml
        working-directory: infra/ansible
      - name: Validate production and observability Compose
        env:
          APP_ENV: production
          DOMAIN: hotel.example.com
          POSTGRES_DB: hotelmate
          POSTGRES_USER: hotelmate
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          ONBOARDING_TOKEN: ci-only-onboarding-token-long-enough
          ALLOWED_ORIGINS: https://hotel.example.com
          HOTELMATE_HOST_UPLOADS_DIR: /srv/hotelmate-private/uploads
          HOTELMATE_OPERATOR_GID: 1001
          HOTELMATE_API_IMAGE: registry.example.com/hotelmate-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          HOTELMATE_WEB_IMAGE: registry.example.com/hotelmate-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
        run: docker compose -f docker-compose.production.yml -f docker-compose.observability.yml config --quiet
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/ops/observability:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/ops/observability:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
      - name: Validate Alertmanager configuration
        run: docker run --rm --entrypoint /bin/amtool -v "$PWD/ops/observability:/etc/hotelmate:ro" prom/alertmanager:v0.28.1 check-config /etc/hotelmate/alertmanager.yml
      - name: Validate Alloy log pipeline
        run: docker run --rm -v "$PWD/ops/observability:/etc/alloy:ro" grafana/alloy:v1.10.0 validate /etc/alloy/config.alloy

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start the integrated stack
        run: docker compose up -d
      - name: Wait for the public readiness endpoint
        run: |
          for _ in {1..30}; do
            if curl -fsS http://localhost:3000/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run public smoke checks through the operations CLI
        run: cd backend && go run ./cmd/hotelmate --base-url http://localhost:3000 smoke
      - name: Run M0-M6 product acceptance through the operations CLI
        env:
          ACCEPTANCE_ONBOARDING_TOKEN: replace-this-onboarding-token
        run: cd backend && go run ./cmd/hotelmate --base-url http://localhost:3000 acceptance
      - name: Verify Prometheus metrics
        run: curl -fsS http://localhost:8080/metrics | grep -q hotelmate_http_requests_total
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the integrated stack
        if: always()
        run: docker compose down -v
